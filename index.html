<script>
let chart = null, metric = 'tpm', range = '1h', trendOpen = false;

const BASE = { tpm: 2050000, rpm: 470 };
const BUCKET_MIN = { '1h': 1, '24h': 15 };

function $(id) { return document.getElementById(id); }
function rnd(i, seed) { const x = Math.sin(i * 12.9898 + seed) * 43758.5453; return x - Math.floor(x); }
function hm(d) { return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function unitOf(m) { return m === 'tpm' ? 'tokens/分' : '次/分'; }
function fmtShort(v, m) {
  if (m === 'tpm') return v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : Math.round(v / 1e3) + 'K';
  return v.toLocaleString();
}

function minuteValue(m, t) {
  const hour = t.getHours() + t.getMinutes() / 60;
  const load = 1 + 0.20 * Math.cos(((hour - 4) / 24) * 2 * Math.PI);
  const idx = Math.round(t.getTime() / 60000);
  const wob = 1 + 0.045 * Math.sin(idx / 9.3) + 0.06 * (rnd(idx, 17) - 0.5) + 0.03 * (rnd(idx, 91) - 0.5);
  return Math.round(BASE[m] * load * wob);
}

function buildSeries(m, r) {
  const step = BUCKET_MIN[r];
  const count = r === '1h' ? 60 : 96;
  const now = new Date();
  const align = new Date(now.getTime() - now.getSeconds() * 1000 - (now.getMinutes() % step) * 60000);
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const t1 = new Date(align.getTime() - i * step * 60000);
    const t0 = new Date(t1.getTime() - step * 60000);
    const samples = [];
    for (let k = 0; k < step; k++) samples.push(minuteValue(m, new Date(t0.getTime() + k * 60000)));
    const avg = Math.round(samples.reduce((a, b) => a + b, 0) / samples.length);
    out.push({ t0, t1, avg, max: Math.max(...samples), raw: step === 1, n: step });
  }
  return out;
}

function loadValues() {
  const tpm = buildSeries('tpm', '1h').pop();
  const rpm = buildSeries('rpm', '1h').pop();
  if ($('vTime')) $('vTime').textContent = hm(tpm.t1);
  if ($('vTpm')) $('vTpm').textContent = tpm.avg.toLocaleString();
  if ($('vRpm')) $('vRpm').textContent = rpm.avg.toLocaleString();
}

function toggleTrend(force) {
  trendOpen = typeof force === 'boolean' ? force : !trendOpen;
  const box = $('trendBox'), head = $('trendHead');
  if (box) box.classList.toggle('show', trendOpen);
  if (head) head.classList.toggle('open', trendOpen);
  if ($('trendHint')) $('trendHint').textContent = trendOpen ? '点击收起' : '点击展开';
  if ($('trendChevron')) $('trendChevron').textContent = trendOpen ? '▴' : '▾';
  if ($('bannerChevron')) $('bannerChevron').textContent = trendOpen ? '▴' : '▾';
  if (trendOpen) {
    render();
    requestAnimationFrame(() => {
      if (chart) chart.resize();
      if (box) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }
}

function switchM(m) {
  metric = m;
  if ($('tabTpm')) $('tabTpm').classList.toggle('active', m === 'tpm');
  if ($('tabRpm')) $('tabRpm').classList.toggle('active', m === 'rpm');
  render();
}

function switchRange(r) {
  range = r;
  if ($('rng1h')) $('rng1h').classList.toggle('active', r === '1h');
  if ($('rng24h')) $('rng24h').classList.toggle('active', r === '24h');
  render();
}

function bestWindow(s) {
  const w = 16;
  let best = 0, at = 0;
  for (let i = 0; i + w <= s.length; i++) {
    const a = s.slice(i, i + w).reduce((x, p) => x + p.avg, 0) / w;
    if (a > best) { best = a; at = i; }
  }
  return { from: hm(s[at].t0), to: hm(s[at + w - 1].t1), val: Math.round(best) };
}

function render() {
  const cv = $('spark');
  if (!cv) return;
  const s = buildSeries(metric, range);
  const isTpm = metric === 'tpm';
  const raw = s[0].raw;
  const cAvg = isTpm ? '#0284c7' : '#7c3aed';
  const cSoft = isTpm ? 'rgba(2,132,199,.10)' : 'rgba(124,58,237,.10)';
  const cBand = isTpm ? '#dbeafe' : '#ede9fe';
  const cBandLine = isTpm ? '#93c5fd' : '#c4b5fd';

  if ($('legRow')) $('legRow').style.display = raw ? 'none' : 'flex';
  if ($('legAvgSwatch')) $('legAvgSwatch').style.background = cAvg;
  if ($('legAvgTxt')) $('legAvgTxt').textContent = raw ? '每分钟限流值' : '15 分钟区间均值';
  if ($('legBandSwatch')) { $('legBandSwatch').style.background = cBand; $('legBandSwatch').style.borderColor = cBandLine; }

  const peak = Math.max(...s.map(p => p.avg));
  if ($('cap')) $('cap').textContent = raw
    ? '近 1 小时 · 每点 1 分钟（最小粒度）· 共 ' + s.length + ' 个数据点 · 区间最高 ' + fmtShort(peak, metric) + ' ' + unitOf(metric)
    : '近 24 小时 · 每点 15 分钟（15 个分钟样本聚合）· 共 ' + s.length + ' 个数据点 · 均值最高 ' + fmtShort(peak, metric) + ' ' + unitOf(metric);

  if ($('note')) {
    if (range === '24h') {
      const bw = bestWindow(s);
      $('note').textContent = '推荐时段 ' + bw.from + '–' + bw.to + '：平台负载低，限流值通常最高（区间均值 ' +
        fmtShort(bw.val, metric) + ' ' + unitOf(metric) + '）。';
      $('note').style.display = 'block';
    } else {
      $('note').style.display = 'none';
    }
  }

  const labels = s.map(p => hm(p.t1));
  const datasets = raw
    ? [{ data: s.map(p => p.avg), borderColor: cAvg, backgroundColor: cSoft, borderWidth: 1.8, fill: 'origin',
        tension: .3, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: cAvg, pointHoverBorderColor: '#fff' }]
    : [
        { data: s.map(p => p.avg), borderColor: cAvg, borderWidth: 1.8, fill: false, tension: .35,
          pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: cAvg, pointHoverBorderColor: '#fff' },
        { data: s.map(p => p.max), borderColor: cBandLine, borderWidth: 1, borderDash: [3,3], fill: '-1',
          backgroundColor: cBand, tension: .35, pointRadius: 0, pointHoverRadius: 0 }
      ];

  if (chart) chart.destroy();
  chart = new Chart(cv.getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a2e', padding: 9, cornerRadius: 6,
          titleFont: { size: 11, weight: '500' }, bodyFont: { size: 11 }, bodySpacing: 3,
          caretSize: 4, displayColors: false,
          callbacks: {
            title: items => {
              const p = s[items[0].dataIndex];
              return raw ? hm(p.t1) : hm(p.t0) + ' – ' + hm(p.t1) + '（15 分钟）';
            },
            label: c => {
              const v = fmtShort(c.parsed.y, metric) + ' ' + unitOf(metric);
              if (raw) return '限流值  ' + v;
              return (c.datasetIndex === 0 ? '区间均值  ' : '桶内峰值  ') + v;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#b0b4bc', font: { size: 10 }, maxTicksLimit: 5, maxRotation: 0 } },
        y: { border: { display: false }, grid: { color: '#f3f4f6' },
          ticks: { color: '#b0b4bc', font: { size: 10 }, maxTicksLimit: 4, callback: v => fmtShort(v, metric) } }
      }
    }
  });
}

function init() {
  loadValues();
  const box = $('trendBox');
  trendOpen = !!(box && box.classList.contains('show'));
  if (trendOpen) render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
